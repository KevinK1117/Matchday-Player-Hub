<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fb"><title>DEL · Matchday PRO</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f8f8;color:#18302e;margin:0}main{max-width:760px;margin:auto;padding:20px}a{color:#087d65}h1{font-size:28px}.card{background:white;border:1px solid #d8e6e1;border-radius:16px;padding:17px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.score{font-size:25px;font-weight:800;color:#087d65}small{color:#677a77}button,input{padding:12px;border-radius:10px;border:1px solid #c9d9d3;font-size:16px}button{background:#087d65;color:white;font-weight:700}.tag{font-weight:700;color:#087d65}</style></head><body><main><a href="/">← Matchday PRO</a><h1>🏒 Deutsche Eishockey Liga · DEL</h1><p>Live-Ergebnisse und Spielübersicht. Eine verlässliche Wett-Gewinnwahrscheinlichkeit erfordert ein geprüftes Prognosemodell und verfügbare Spieldaten.</p><div class="row"><input id="date" type="date"><button id="refresh">Aktualisieren</button></div><p id="info">DEL-Daten werden geladen …</p><section id="games"></section></main><script>const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());async function load(){ $('info').textContent='DEL-Daten werden geladen …';try{const r=await fetch('/api/nhlcenter?action=del&date='+encodeURIComponent($('date').value));const d=await r.json();if(!r.ok)throw Error(d.error||'Abruf fehlgeschlagen');$('info').textContent=d.notice||((d.games||[]).length+' DEL-Spiele · '+(d.source||'')+' · '+new Date().toLocaleTimeString('de-DE'));$('games').innerHTML=(d.games||[]).map(g=>'<article class="card"><div class="row"><div><div class="tag">'+esc(g.status)+'</div><h3>'+esc(g.home)+' – '+esc(g.away)+'</h3><small>'+esc(g.date?new Date(g.date).toLocaleString('de-DE'):'')+'</small></div><div class="score">'+esc(g.homeGoals??'–')+' : '+esc(g.awayGoals??'–')+'</div></div><p><small>Prognose: noch keine kalibrierte DEL-Wahrscheinlichkeit verfügbar</small></p></article>').join('')||'<p>Keine DEL-Spiele für dieses Datum gefunden.</p>'}catch(e){$('info').textContent=e.message;$('games').innerHTML=''}}$('refresh').onclick=load;$('date').onchange=load;load();</script></body></html>
